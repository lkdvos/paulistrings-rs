name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p paulistrings --all-targets --features phase-timing -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --doc -p paulistrings
      - run: cargo build --examples -p paulistrings
      - run: cargo test -p paulistrings --features phase-timing
      - run: cargo build -p paulistrings --features phase-timing --example phase_breakdown

  mpi:
    name: mpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rsmpi needs an MPI to probe (`mpicc`) and a libclang for its bindgen.
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p paulistrings --all-targets --features mpi -- -D warnings
      # A singleton world: Open MPI initializes fine outside mpirun, so the
      # whole matrix runs at one rank without a launcher.
      - run: cargo test -p paulistrings --features mpi
      # And the real thing, at 2 and 4 ranks. The runner has two cores, hence
      # --oversubscribe.
      - run: scripts/mpi-test.sh --ranks 2,4 --oversubscribe
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p paulistrings --features mpi

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p paulistrings

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Debug-profile build: the tests check correctness, not performance,
      # and skipping the lto=fat/codegen-units=1 release link keeps the job
      # fast. The release codegen path is covered by the Rust test job.
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.5,<2.0' 'pytest>=7' 'numpy>=1.24'
          maturin develop -m crates/paulistrings-py/Cargo.toml
          pytest python/paulistrings/tests -q
