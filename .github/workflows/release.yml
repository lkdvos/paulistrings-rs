name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: tag matches package version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: compare tag to pyproject.toml / Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(scripts/check-version-sync.sh)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag v$tag does not match Cargo.toml/pyproject.toml ($version)"
            exit 1
          fi

  wheels:
    name: wheel (${{ matrix.name }})
    needs: [sanity]
    if: always() && (needs.sanity.result == 'success' || needs.sanity.result == 'skipped')
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28", features: cuda }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", features: cuda }
          # Both macOS wheels come off one arm64 runner; the Intel one is a cross-build,
          # which abi3 allows since no x86_64 interpreter is needed at build time.
          # No `cuda` on macOS, which has no CUDA driver.
          - { name: macos-x86_64, os: macos-14, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, target: x64, features: cuda }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `cuda` dlopens libcuda and libnvrtc at runtime, so it builds with no toolkit and the wheel imports without a GPU.
      # `mpi` is never in a wheel, since no MPI build is portable across clusters; it is a source build from the sdist.
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # PyPI rejects an sdist whose metadata names a `License-File` the archive lacks, after the wheels are already up.
      - name: every License-File is in the sdist
        run: |
          sdist=$(ls dist/*.tar.gz)
          root=$(basename "$sdist" .tar.gz)
          tar xzf "$sdist" -O "$root/PKG-INFO" | sed -n 's/^License-File: //p' | while read -r file; do
            tar tzf "$sdist" "$root/$file" >/dev/null || { echo "::error::$file is named in PKG-INFO but missing from $sdist"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.wheel }}, py${{ matrix.python }})
    needs: [wheels, sdist]
    # Explicit, since the implicit `success()` also fails on the `sanity` skip of a dispatch run.
    if: always() && needs.wheels.result == 'success' && needs.sdist.result == 'success'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, wheel: linux-x86_64, python: "3.9", arch: x64 }
          - { os: ubuntu-latest, wheel: linux-x86_64, python: "3.13", arch: x64 }
          - { os: ubuntu-24.04-arm, wheel: linux-aarch64, python: "3.12", arch: arm64 }
          - { os: macos-14, wheel: macos-arm64, python: "3.12", arch: arm64 }
          # The x64 interpreter is universal2 and would run as arm64, so `arch` forces it under Rosetta.
          - { os: macos-14, wheel: macos-x86_64, python: "3.12", arch: x64, prefix: "arch -x86_64" }
          - { os: windows-latest, wheel: windows-x86_64, python: "3.12", arch: x64 }
          # The fallback for every platform without a wheel: pip builds the sdist, which needs a Rust toolchain.
          - { os: ubuntu-latest, wheel: sdist, python: "3.12", arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/wheel-smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel == 'sdist' && 'sdist' || format('wheel-{0}', matrix.wheel) }}
          path: dist
      - run: ${{ matrix.prefix }} python -m pip install dist/*
      # `-I` and a cwd outside the checkout, so the import resolves to the installed package.
      - run: cd "$RUNNER_TEMP" && ${{ matrix.prefix }} python -I "$GITHUB_WORKSPACE/scripts/wheel-smoke.py"

  release:
    name: publish release
    needs: [sanity, wheels, sdist, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI trusts this repository, workflow and environment, so no token is stored.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
