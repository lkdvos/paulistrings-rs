[workspace]

[package]
name = "presentation-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Baselines and sweeps behind the figures of the paulistrings-rs talk"

[dependencies]
paulistrings = { path = "../../crates/paulistrings", features = ["phase-timing", "test-utils"] }
num-complex = "0.4"
rayon = "1"
hashbrown = "0.14"
rustc-hash = "2"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
