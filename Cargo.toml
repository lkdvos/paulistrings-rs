[workspace]
resolver = "2"
members = [
    "crates/membench",
    "crates/paulistrings",
    "crates/paulistrings-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkdvos/paulistrings-rs"

[workspace.dependencies]
paulistrings = { path = "crates/paulistrings", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
# Line tables let `perf` attribute samples through fat-LTO inlining, without changing codegen.
debug = "line-tables-only"

# Release codegen plus line tables, for perf (benchmarks/PROFILING.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
