name: crates-publish

# Manual only, deliberately decoupled from release.yml's tag-triggered wheel
# builds: the Rust crate is the secondary front end here, and its release
# cadence (API stability) has nothing to do with the Python wheels'.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (cargo publish --dry-run, nothing is uploaded)"
        type: boolean
        default: true

jobs:
  publish:
    name: cargo publish paulistrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo publish (dry run)
        if: inputs.dry_run
        run: cargo publish -p paulistrings --locked --dry-run
      - name: cargo publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p paulistrings --locked
