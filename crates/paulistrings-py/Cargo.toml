[package]
name = "paulistrings-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for paulistrings"
# A cdylib with no reusable Rust API; distributed as wheels, never as a crate.
publish = false

[lib]
name = "_paulistrings"
crate-type = ["cdylib"]

[features]
# Compile the MPI surface of the bindings: `comm=` / `result=` on the two
# propagate entry points, `PartitionStats.rank`/`.size`, and
# `paulistrings.mpi_available() -> True`. Off by default, like the core's own
# `mpi`: it needs an MPI installation plus `libclang` for rsmpi's bindgen, and
# the default cdylib must stay unchanged. Build it with
# `maturin develop --release --features mpi`.
mpi = ["paulistrings/mpi"]
# Compile the CUDA surface of the bindings: `device=` on the two propagate
# entry points, a constructible `GpuPauliSum` via `PauliSum.to_device`, and a
# live `paulistrings.cuda_available()`. Off by default, like `mpi`; it needs no
# toolkit to build. Build it with `maturin develop --release --features cuda`.
cuda = ["paulistrings/cuda"]

[dependencies]
paulistrings = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39", "num-complex"] }
numpy = "0.22"
num-complex = "0.4"
log = "0.4"
# 0.11 is the last pyo3-log line that accepts pyo3 0.22 (its requirement is
# `>=0.21, <0.23`); 0.12 moved to pyo3 0.23. Bump both together.
pyo3-log = "0.11"
