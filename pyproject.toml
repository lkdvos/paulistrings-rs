[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "paulistrings-rs"
version = "0.1.0"
description = "Classical simulation of quantum circuits in the Pauli basis, with a parallel Rust engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Lukas Devos", email = "ldevos@flatironinstitute.org" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-benchmark>=4", "ruff", "maturin"]
bench = ["pytest-benchmark>=4", "qiskit", "numpy", "stim"]
# The examples & benchmarks suite (`examples/`): circuit importers and the
# ground-truth oracles in `examples/common/oracles.py` (qiskit Aer for the dense
# reference, stim for the Clifford one), plus the report plots. Every
# CI-visible test importorskips these, so the numpy-only CI job stays green
# without them.
examples = ["matplotlib", "stim", "qiskit", "qiskit-aer", "numpy"]
# The bindings' MPI net (`scripts/mpi-test.sh --python`); mpi4py must compile against the loaded MPI.
mpi = ["mpi4py>=4,<5"]

[tool.maturin]
manifest-path = "crates/paulistrings-py/Cargo.toml"
module-name = "paulistrings._paulistrings"
python-source = "python"
features = ["pyo3/extension-module"]

# What a bare `uv sync`/`uv run` installs, and the venv's maturin builds the extension; keep it in step with the `dev` extra.
# Not `paulistrings-rs[dev]`: outside uv (`maturin develop` installs this group) a self-referencing extra resolves against PyPI, where this project is not published.
[dependency-groups]
dev = ["pytest>=7", "pytest-benchmark>=4", "ruff", "maturin>=1.5,<2.0"]

[tool.uv]
# uv reuses a built extension until one of these changes, so any Rust edit rebuilds it on the next `uv sync`/`uv run`.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "rust-toolchain.toml" },
  { file = ".cargo/config.toml" },
  { file = "crates/paulistrings/Cargo.toml" },
  { file = "crates/paulistrings/build.rs" },
  { file = "crates/paulistrings/src/**/*" },
  { file = "crates/paulistrings-py/Cargo.toml" },
  { file = "crates/paulistrings-py/build.rs" },
  { file = "crates/paulistrings-py/src/**/*" },
  # Features and profile (`--features mpi`, `--profile dev`), so changing them rebuilds too.
  { env = "MATURIN_PEP517_ARGS" },
]
# Resolve only for the interpreters and platforms development uses; end users install wheels.
environments = [
  "python_version >= '3.11' and sys_platform == 'linux'",
  "python_version >= '3.11' and sys_platform == 'darwin'",
]
no-binary-package = ["mpi4py"]
# An isolated build hands maturin a fresh interpreter path each time, which dirties pyo3 and relinks the whole LTO build even when no Rust changed.
no-build-isolation-package = ["paulistrings"]

[tool.pytest.ini_options]
# Discover `test_*.py` (library unit tests in `python/paulistrings/tests/`, the
# showcase suite's tests in `examples/tests/`, and the benchmark-driver tests in
# `benchmarks/python/tests/`) and `bench_*.py` (cross-library suites living directly
# in `benchmarks/python/`).
python_files = ["test_*.py", "bench_*.py"]
