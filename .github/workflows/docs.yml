name: docs

on:
  push:
    branches: [main]
  # A pull request that touches the site builds, link-checks, and live-runs
  # the doc snippets; same-repo PRs (forks can't write) also get a preview
  # deploy under pr-preview/pr-<n>/, removed again when the PR closes.
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  workflow_dispatch:

env:
  # Keep this in step with the version docs/README.md tells contributors to
  # install, so a local build and CI cannot disagree about rendering.
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      # Prefer the prebuilt binary (seconds); fall back to a pinned
      # `cargo install` if the release asset ever moves.
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          if curl -sSfL -o /tmp/mdbook.tar.gz "$url"; then
            tar -xzf /tmp/mdbook.tar.gz -C "$HOME/.local/bin"
          else
            echo "prebuilt mdBook v${MDBOOK_VERSION} not found; building from source"
            cargo install mdbook --locked --version "${MDBOOK_VERSION}"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The figures are relative symlinks into the repository (see
      # docs/sync-assets.sh); this both validates them and proves the committed
      # set is what the script produces.
      - name: Check the figure links resolve
        run: ./docs/sync-assets.sh

      - name: Fail if sync-assets.sh changed anything
        run: git diff --exit-code -- docs/book/src/assets

      - name: Build the book
        run: mdbook build docs/book

      - name: Build rustdoc
        run: cargo doc --no-deps -p paulistrings

      # The book is the site root; rustdoc is mounted under /api/ with a
      # redirect so /api/ alone lands on the crate index. README.md's
      # Documentation section points at both.
      - name: Assemble the site
        run: |
          mv docs/book/site _site
          mkdir -p _site/api
          cp -r target/doc/. _site/api/
          cat > _site/api/index.html <<'HTML'
          <!DOCTYPE html>
          <meta http-equiv="refresh" content="0; url=paulistrings/index.html">
          <link rel="canonical" href="paulistrings/index.html">
          <title>paulistrings API reference</title>
          HTML
          touch _site/.nojekyll

      - name: Check for broken internal links and images
        run: |
          python3 - <<'PY'
          import html, re, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          root = Path("_site").resolve()
          attr = re.compile(r'(?:href|src)\s*=\s*"([^"]+)"')
          # rustdoc's own output is not ours to police; check the book pages.
          pages = [p for p in root.rglob("*.html") if "api" not in p.relative_to(root).parts]
          problems = []
          for page in pages:
              text = page.read_text(encoding="utf-8", errors="replace")
              for raw in attr.findall(text):
                  parsed = urlparse(html.unescape(raw))
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  path = unquote(parsed.path)
                  if path.startswith("/"):
                      target = root / path.lstrip("/").removeprefix("paulistrings-rs/")
                  else:
                      target = (page.parent / path).resolve()
                  if not target.exists():
                      problems.append(f"{page.relative_to(root)} -> {raw}")
          print(f"checked {len(pages)} book pages")
          for p in problems:
              print("BROKEN:", p)
          sys.exit(1 if problems else 0)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Debug-profile build, same as the `python` CI job: these snippets check
      # correctness, not performance. `stim`/`qiskit` cover the interop how-to.
      - name: Build the Python extension
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.5,<2.0' 'numpy>=1.24' stim qiskit
          maturin develop -m crates/paulistrings-py/Cargo.toml

      # Every ```python fence in the book runs for real against the built
      # extension, except ones marked `<!-- doctest: skip -->` (MPI/NUMA
      # snippets this runner has no hardware for, and case-study excerpts
      # already covered by `pytest examples/tests`).
      - name: Run the doc snippets
        run: |
          source .venv/bin/activate
          python scripts/test-doc-snippets.py

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Non-fork PRs and pushes to main can write to this repo; deploy/preview
  # need that to push to `gh-pages`, so both are skipped otherwise.
  can-write:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.can-write.outputs.allowed == 'true'
    needs: [build, can-write]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      # `keep_files` preserves the `pr-preview/` subtrees the preview job
      # below writes to the same branch — a plain force-push would wipe them.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          keep_files: true

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.can-write.outputs.allowed == 'true'
    needs: [build, can-write]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  preview-remove:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
