name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  version-sync:
    name: Cargo.toml / pyproject.toml versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version-sync.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p paulistrings --all-targets --features phase-timing -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --doc -p paulistrings
      - run: cargo build --examples -p paulistrings
      - run: cargo test -p paulistrings --features phase-timing
      - run: cargo build -p paulistrings --features phase-timing --example phase_breakdown

  mpi:
    name: mpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rsmpi needs an MPI to probe (`mpicc`) and a libclang for its bindgen.
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p paulistrings --all-targets --features mpi -- -D warnings
      # A singleton world: Open MPI initializes fine outside mpirun, so the
      # whole matrix runs at one rank without a launcher.
      - run: cargo test -p paulistrings --features mpi
      # And the real thing, at 2 and 4 ranks. The runner has two cores, hence
      # --oversubscribe.
      - run: scripts/mpi-test.sh --ranks 2,4 --oversubscribe
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p paulistrings --features mpi
      - run: cargo clippy -p paulistrings-py --features mpi -- -D warnings
      # `cuda` with `mpi` compiles the NCCL exchange; NCCL is `dlopen`ed like `libcuda`/`libnvrtc`, so
      # this builds with no NCCL installation and no GPU on the runner, same as the `cuda` job below.
      - run: cargo clippy -p paulistrings --all-targets --features cuda,mpi -- -D warnings
      - run: cargo test -p paulistrings --features cuda,mpi
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p paulistrings --features cuda,mpi
      - run: cargo clippy -p paulistrings-py --features cuda,mpi -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      # mpi4py is never taken as a wheel (`no-binary-package`), so it compiles
      # against the libopenmpi-dev installed above (~1-2 min). `continue-on-error`
      # plus the `outcome` guard below: a broken mpi4py build skips the Python
      # leg with a visible red X on this step rather than failing the job,
      # because the Rust net above already covers the transport.
      - id: mpi4py
        name: build the MPI venv's dependencies (mpi4py compiles here)
        continue-on-error: true
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-mpi uv sync --extra mpi --no-install-project --python "$(command -v python3)"
          .venv-mpi/bin/python -c 'import mpi4py; print(mpi4py.__version__)'
      # Builds the extension into ./.venv-mpi through scripts/sync-mpi-venv.sh, in the dev profile.
      - name: the bindings' MPI net, at 2 and 4 ranks
        if: steps.mpi4py.outcome == 'success'
        run: scripts/mpi-test.sh --ranks 2,4 --oversubscribe --python --no-rust
      - name: say so when the Python leg was skipped
        if: steps.mpi4py.outcome != 'success'
        run: echo "::warning::mpi4py could not be installed; the bindings' MPI net did not run"

  cuda:
    name: cuda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cudarc loads libcuda and libnvrtc at runtime, so the feature builds with no toolkit installed.
      - run: cargo clippy -p paulistrings --all-targets --features cuda -- -D warnings
      - run: cargo clippy -p paulistrings-py --features cuda -- -D warnings
      # No device on the runner: every device test returns early through `cuda_available()`, which must not panic.
      - run: cargo test -p paulistrings --features cuda
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p paulistrings --features cuda
      - run: cargo build -p paulistrings --features phase-timing,cuda
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # NVRTC compiles kernels without a driver, so the wheel alone lets the runner check kernel syntax for every width.
      - id: nvrtc
        name: kernel syntax check through the NVRTC wheel
        continue-on-error: true
        run: |
          python -m pip install 'nvidia-cuda-nvrtc-cu12>=12.8,<13'
          export LD_LIBRARY_PATH="$(python -c 'import nvidia.cuda_nvrtc, os; print(os.path.join(os.path.dirname(nvidia.cuda_nvrtc.__file__), "lib"))'):$LD_LIBRARY_PATH"
          cargo test -p paulistrings --features cuda kernels_compile -- --nocapture
      - name: say so when the NVRTC leg was skipped
        if: steps.nvrtc.outcome != 'success'
        run: echo "::warning::the NVRTC wheel could not be used; kernel syntax was not checked on this runner"

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p paulistrings

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # The interpreter is the one `.python-version` names.
      - uses: astral-sh/setup-uv@v6
      # Debug-profile build: the tests check correctness, not performance, and skipping the release link keeps the job fast.
      # The release codegen path is covered by the Rust test job.
      # MATURIN_PEP517_ARGS is one of uv's cache keys, so it must be the same for every uv command in the job.
      - env:
          MATURIN_PEP517_ARGS: --profile dev
        run: |
          uv sync
          uv run pytest python/paulistrings/tests -q
          uv run pytest examples/tests benchmarks/python/tests -q
