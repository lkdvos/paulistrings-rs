[package]
name = "membench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STREAM-style memory-bandwidth ceiling probe for the benchmark host"
publish = false

[features]
# The device kernels behind `--device N`; the same dependency line as the core crate's `cuda` feature.
cuda = ["dep:cudarc"]

[dependencies]
rayon = "1"
cudarc = { version = "0.19.9", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12080",
    "fallback-dynamic-loading",
] }
