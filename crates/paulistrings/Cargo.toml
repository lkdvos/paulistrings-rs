[package]
name = "paulistrings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pauli string manipulation in Rust"
documentation = "https://docs.rs/paulistrings"
readme = "README.md"
keywords = ["pauli", "quantum", "simulation", "physics", "operator"]
categories = ["science", "simulation"]

[package.metadata.docs.rs]
# Not `all-features = true`: the `mpi` feature builds `rsmpi`, whose build
# script probes an `mpicc` and runs `bindgen` against the site's MPI headers.
# Neither exists on docs.rs, so the whole build would fail there.
features = ["phase-timing", "test-utils", "cuda"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Compile per-phase timing counters into the engine (see `engine::stats`).
# Measurement builds only — never enable by default: the default build must
# stay byte- and performance-identical to an uninstrumented one.
phase-timing = []
# Compile `src/test_support.rs` (the naive differential oracle and the shared
# random-sum fixtures) into the library so integration tests, benches and
# examples can use it. Enabled for the crate's own dev builds by the
# self-dev-dependency below; never part of a published build's default set.
test-utils = []
# Compile the MPI transport (`engine::partitioned::mpi`), one partition per
# rank. Off by default, like `phase-timing`: the default build must stay
# byte-identical, and the feature needs an MPI installation plus `libclang`
# for `rsmpi`'s bindgen (`module load openmpi/5.0.6 llvm/19.1.7`,
# `LIBCLANG_PATH=$(llvm-config --libdir)`).
mpi = ["dep:mpi"]
# Compile the CUDA backend (`engine::gpu`), one device today, multi-device
# later over the existing partitioned exchange. Off by default, like `mpi`:
# the default build must stay byte-identical, and `cudarc` loads
# `libcuda`/`libnvrtc` at runtime (`fallback-dynamic-loading`), so there is no
# build-time toolkit requirement at all — `cargo build --features cuda` links
# and runs on a box with no GPU, and every device-touching test returns early
# through `gpu::cuda_available()`.
cuda = ["dep:cudarc"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# `bytemuck` feature: `Complex64: Pod`, so exchange blocks (engine::partitioned) cast
# coefficient columns to bytes without a copy.
num-complex = { version = "0.4", features = ["bytemuck"] }
hashbrown = "0.14"
rustc-hash = "2"
rayon = "1"
# Progress logging through the `log` facade. Deliberately a plain (not
# optional, not feature-gated) dependency: with no logger installed the
# per-layer sites cost one relaxed atomic load and allocate nothing, so there
# is nothing for a feature flag to buy. See `engine::propagate_with_scratch`.
log = "0.4"
# MPI bindings for the distributed transport, behind the `mpi` feature.
# `default-features = false` drops the `user-operations` feature (libffi), which
# nothing here needs — the two reductions are `MPI_MAX`/`MPI_SUM`.
mpi = { version = "0.8.2", optional = true, default-features = false }
# CUDA driver + NVRTC bindings for the `cuda` feature. `default-features =
# false` is load-bearing: the crate's defaults dlopen cublas/curand/the CUDA
# runtime, none of which the hand-written NVRTC kernels touch.
cudarc = { version = "0.19.9", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12080",
    "fallback-dynamic-loading",
] }

# NUMA topology and thread/memory pinning (engine::partitioned::topology). Linux
# only; on other targets the topology module reports one node and pins nothing.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# Logger implementation for the examples/tests only (`RUST_LOG`-driven).
env_logger = "0.11"
# Self-dependency so the lib is built with `test-utils` for tests, benches and
# examples; feature unification means one copy of the crate, with the module
# present.
paulistrings = { path = ".", features = ["test-utils"] }

[[bench]]
name = "pauli_ops"
harness = false

[[example]]
name = "phase_breakdown"
required-features = ["phase-timing"]

[[example]]
name = "gpu_peer"
required-features = ["cuda"]

# The multi-rank differential net. `harness = false`: the cases are collective,
# so they must run in the same order on every rank, one at a time — none of
# which the libtest harness (which may run cases in parallel, in an unspecified
# order) allows. `main` drives the matrix, all-reduces each verdict and exits
# with the same status on every rank. Driven by `scripts/mpi-test.sh`; a plain
# `cargo test --features mpi` runs it as a singleton world of one rank.
[[test]]
name = "mpi_ranks"
harness = false
required-features = ["mpi", "test-utils"]

# The CUDA backend's differential net; every case returns early without a device.
[[test]]
name = "propagate_gpu"
required-features = ["cuda", "test-utils"]

[[test]]
name = "propagate_gpu_partitioned"
required-features = ["cuda", "test-utils"]
