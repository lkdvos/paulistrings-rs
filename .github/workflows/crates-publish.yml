name: crates-publish

# Manual only, run after release.yml's tag-triggered wheel build for the same
# version: Rust and Python are released together, one version for both, so
# this checks Cargo.toml agrees with pyproject.toml before publishing rather
# than trusting a tag of its own.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (cargo publish --dry-run, nothing is uploaded)"
        type: boolean
        default: true

jobs:
  publish:
    name: cargo publish paulistrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo.toml matches pyproject.toml
        run: |
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          pyproject_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [[ "$cargo_version" != "$pyproject_version" ]]; then
            echo "::error::Cargo.toml ($cargo_version) and pyproject.toml ($pyproject_version) disagree — release both together"
            exit 1
          fi
      - name: cargo publish (dry run)
        if: inputs.dry_run
        run: cargo publish -p paulistrings --locked --dry-run
      - name: cargo publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p paulistrings --locked
