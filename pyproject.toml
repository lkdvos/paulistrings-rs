[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "paulistrings"
version = "0.1.0"
description = "Pauli string manipulation, Rust-backed"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Lukas Devos", email = "ldevos@flatironinstitute.org" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-benchmark>=4", "ruff", "maturin"]
bench = ["pytest-benchmark>=4", "qiskit", "openfermion", "numpy"]

[tool.maturin]
manifest-path = "crates/paulistrings-py/Cargo.toml"
module-name = "paulistrings._paulistrings"
python-source = "python"
features = ["pyo3/extension-module"]
