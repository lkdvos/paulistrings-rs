[package]
name = "paulistrings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Classical simulation of quantum circuits in the Pauli basis, parallel across threads, NUMA domains, MPI ranks and GPUs"
documentation = "https://docs.rs/paulistrings"
readme = "README.md"
keywords = ["pauli", "quantum", "simulation", "physics", "operator"]
categories = ["science", "simulation"]

[package.metadata.docs.rs]
# Not `all-features = true`: `mpi` needs an MPI installation and libclang, which docs.rs lacks.
features = ["phase-timing", "test-utils", "cuda"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Every feature is off by default; the default build must stay byte- and performance-identical without them.
# Per-phase timing counters in the engine.
phase-timing = []
# `test_support` (the differential oracle and shared fixtures), on for the crate's own dev builds via the self-dependency below.
test-utils = []
# The MPI transport; with `cuda`, also the NCCL device exchange.
# `nccl-02022`, not the bare `nccl`, which binds 2.30's larger `ncclConfig_t` than the 2.23 library's.
mpi = ["dep:mpi", "cudarc?/nccl-02022"]
# The CUDA backend; `cudarc` loads libcuda and libnvrtc at runtime, so building needs no toolkit.
cuda = ["dep:cudarc"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# `bytemuck`: exchange blocks cast coefficient columns to bytes without a copy.
num-complex = { version = "0.4", features = ["bytemuck"] }
hashbrown = "0.14"
rustc-hash = "2"
rayon = "1.9"
# Not feature-gated: with no logger installed a log site costs one relaxed atomic load.
log = "0.4"
# `default-features = false` drops `user-operations` (libffi); only `MPI_MAX`/`MPI_SUM` are used.
mpi = { version = "0.8.2", optional = true, default-features = false }
# `default-features = false` is load-bearing: the defaults dlopen cuBLAS, cuRAND and the CUDA runtime, which the NVRTC kernels never use.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12080",
    "fallback-dynamic-loading",
] }

# Thread and memory pinning, Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
env_logger = "0.11"
# Self-dependency: tests, benches and examples see the lib built with `test-utils`.
paulistrings = { path = ".", features = ["test-utils"] }

[[bench]]
name = "pauli_ops"
harness = false

[[example]]
name = "phase_breakdown"
required-features = ["phase-timing"]

# `harness = false`: the cases are collective, so they must run one at a time in the same order on every rank.
[[test]]
name = "mpi_ranks"
harness = false
required-features = ["mpi", "test-utils"]

[[test]]
name = "propagate_gpu"
required-features = ["cuda", "test-utils"]

[[test]]
name = "propagate_gpu_partitioned"
required-features = ["cuda", "test-utils"]
