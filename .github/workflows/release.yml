name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: tag matches package version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: compare tag to pyproject.toml / Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [[ "$tag" != "$pyproject_version" || "$tag" != "$cargo_version" ]]; then
            echo "::error::tag v$tag does not match pyproject.toml ($pyproject_version) / Cargo.toml ($cargo_version)"
            exit 1
          fi

  wheels:
    name: wheel (${{ matrix.target }})
    needs: [sanity]
    if: always() && (needs.sanity.result == 'success' || needs.sanity.result == 'skipped')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          # Both macOS wheels come off one arm64 runner; the Intel one is a cross-build,
          # which abi3 allows since no x86_64 interpreter is needed at build time.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Default features only: the `mpi` feature is never portable across
      # cluster MPI installs, so it is never part of a distributed wheel —
      # see CLAUDE.md's Commands section for the from-source `mpi` install.
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --manifest-path crates/paulistrings-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: publish release
    needs: [sanity, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
