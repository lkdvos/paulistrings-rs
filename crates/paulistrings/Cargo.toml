[package]
name = "paulistrings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pauli string manipulation in Rust"
documentation = "https://docs.rs/paulistrings"
readme = "README.md"
keywords = ["pauli", "quantum", "simulation", "physics", "operator"]
categories = ["science", "simulation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Compile per-phase timing counters into the engine (see `engine::stats`).
# Measurement builds only — never enable by default: the default build must
# stay byte- and performance-identical to an uninstrumented one.
phase-timing = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
num-complex = "0.4"
hashbrown = "0.14"
rustc-hash = "2"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "pauli_ops"
harness = false

[[example]]
name = "phase_breakdown"
required-features = ["phase-timing"]
