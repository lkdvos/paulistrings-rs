[package]
name = "paulistrings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pauli string manipulation in Rust"
documentation = "https://docs.rs/paulistrings"
readme = "README.md"
keywords = ["pauli", "quantum", "simulation", "physics", "operator"]
categories = ["science", "simulation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Compile per-phase timing counters into the engine (see `engine::stats`).
# Measurement builds only — never enable by default: the default build must
# stay byte- and performance-identical to an uninstrumented one.
phase-timing = []
# Compile `src/test_support.rs` (the naive differential oracle and the shared
# random-sum fixtures) into the library so integration tests, benches and
# examples can use it. Enabled for the crate's own dev builds by the
# self-dev-dependency below; never part of a published build's default set.
test-utils = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
num-complex = "0.4"
hashbrown = "0.14"
rustc-hash = "2"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# Self-dependency so the lib is built with `test-utils` for tests, benches and
# examples; feature unification means one copy of the crate, with the module
# present.
paulistrings = { path = ".", features = ["test-utils"] }

[[bench]]
name = "pauli_ops"
harness = false

[[example]]
name = "phase_breakdown"
required-features = ["phase-timing"]
