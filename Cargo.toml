[workspace]
resolver = "2"
members = [
    "crates/membench",
    "crates/paulistrings",
    "crates/paulistrings-py",
]
# The presentation benchmarks are their own workspace: they enable the
# measurement-only `phase-timing`/`test-utils` features, which must never unify
# into the shipped build, and they need an isolated target dir for RUSTFLAGS A/Bs.
exclude = ["presentation/bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkdvos/paulistrings-rs"

[workspace.dependencies]
paulistrings = { path = "crates/paulistrings", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
# Line tables let `perf record` on a criterion bench (via --profile-time)
# attribute samples through the fat-LTO inlining; no codegen change.
debug = "line-tables-only"

# `perf record` / flamegraph builds: identical codegen to release (same LTO,
# same codegen-units — profile what ships), plus the line/inline tables that
# perf and addr2line need to expand inlined frames. See benchmarks/PROFILING.md.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
